[package]
name = "tpt-usb-rescue"
description = "Forensic data recovery engine for failing USB mass storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["forensics", "data-recovery", "usb", "ddrescue", "carving"]
categories = ["command-line-utilities", "filesystem"]

[lints]
workspace = true

[dependencies]
clap.workspace = true
ctrlc.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
memmap2.workspace = true
tpt-usb-rescue-hal.workspace = true
tpt-usb-rescue-imager.workspace = true
tpt-usb-rescue-carver.workspace = true
tpt-usb-rescue-fs.workspace = true

[dev-dependencies]
crc32fast.workspace = true

# Lets `cargo binstall tpt-usb-rescue` fetch the prebuilt archive from the GitHub Release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tpt-usb-rescue-v{ version }-{ target }{ archive-suffix }"
bin-dir = "tpt-usb-rescue-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
