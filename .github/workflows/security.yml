name: Security audit

# New advisories appear without any change to this repository, so check on a schedule as well.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["Cargo.lock", "deny.toml"]
  pull_request:
    paths: ["Cargo.lock", "deny.toml"]

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
