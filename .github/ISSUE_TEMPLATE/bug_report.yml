name: Bug report
description: Something went wrong while imaging, carving, analyzing or verifying
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** attach files recovered from private drives, and do
        not report security problems here: see SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: Copy it as you typed it, including options.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit code
      description: Everything the tool printed, and the exit code (`echo $?` or `$LASTEXITCODE`).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tpt-usb-rescue --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: What were you reading from?
      options:
        - A real device
        - A disk image file
        - Not sure
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: About the device (if there was one)
      description: Type (USB stick, SD card, hard drive), size, how it fails, and how it is connected (direct port or hub).
  - type: textarea
    id: mapfile
    attributes:
      label: Mapfile summary
      description: Output of `tpt-usb-rescue mapfile <your .map file>`, if the problem is with imaging.
      render: text
